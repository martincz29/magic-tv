name: Build Magic TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main, feat/ornamental-magic-tv-ui ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle clean assembleDebug
      - name: Prepare download site
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          cp app/build/outputs/apk/debug/app-debug.apk site/MagicTV-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MagicTV-v0.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish feature branch preview APK
        if: github.ref == 'refs/heads/feat/ornamental-magic-tv-ui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MagicTV-ornamental-ui.apk
          gh release create ornamental-ui-preview-v1 \
            MagicTV-ornamental-ui.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Magic TV ornamental UI preview" \
            --notes "Preview APK built from feat/ornamental-magic-tv-ui. Not merged to main." \
            --prerelease
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
